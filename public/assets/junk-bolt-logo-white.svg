<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 76" fill="none">
  <defs>
    <linearGradient id="boltGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FCD34D" />
      <stop offset="40%" stop-color="#F59E0B" />
      <stop offset="100%" stop-color="#D97706" />
    </linearGradient>
    <filter id="logoShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="1.5" flood-color="#000000" flood-opacity="0.5" />
    </filter>
  </defs>

  <g transform="skewX(-10)" filter="url(#logoShadow)">
    <!-- JUNK TEXT (WHITE) -->
    <text x="4" y="32" font-family="'Montserrat', 'Arial Black', sans-serif" font-weight="900" font-size="36" letter-spacing="-0.5" fill="#FFFFFF" stroke="rgba(0,0,0,0.4)" stroke-width="0.8">
      JUNK
    </text>

    <!-- BOLT GROUP -->
    <g transform="translate(4, 38)">
      <g transform="translate(-1, 0)">
        <path d="M11 2 L2 18 L9 18 L4 35 L19 15 L12 15 Z" fill="url(#boltGrad)" stroke="#B45309" stroke-width="0.8" stroke-linejoin="round" />
        <path d="M10 4 C15 4 19 6 19 10 C19 14 15 16 10 16 Z" fill="url(#boltGrad)" />
        <path d="M10 16 C16 16 21 18 21 23 C21 28 15 30 9 30 Z" fill="url(#boltGrad)" />
        <path d="M10 7 C12 7 14 8 14 10 C14 12 12 13 10 13 Z" fill="#0a1424" />
        <path d="M10 19 C13 19 15 21 15 23 C15 25 13 27 10 27 Z" fill="#0a1424" />
      </g>
      <text x="23" y="28" font-family="'Montserrat', 'Arial Black', sans-serif" font-weight="900" font-size="36" letter-spacing="-0.5" fill="url(#boltGrad)" stroke="#B45309" stroke-width="0.5">
        OLT
      </text>
    </g>
  </g>
</svg>
